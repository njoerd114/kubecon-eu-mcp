[project]
name = "conference-mcp"
version = "0.3.0"
description = "MCP server for tech conferences — agentic schedule planner, party optimizer, and conference guide. Supports KubeCon EU 2026 and ContainerDays Hamburg 2026."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Conference MCP Contributors" }]
keywords = ["mcp", "kubecon", "containerdays", "cncf", "cloud-native", "conference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "icalendar>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
]

[project.scripts]
conference-mcp = "conference_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conference_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
